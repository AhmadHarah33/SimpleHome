<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SimpleHome</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="home">
  <div id="wall"></div>
  <div id="shade"></div>
  <div id="clock"></div>
  <div id="date"></div>
  <div id="utils">
    <div id="util-wall" class="util"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m3 16 5-5 4 4 3-3 6 6"/><circle cx="16" cy="9" r="1.5"/></svg><span>Wallpaper</span></div>
    <div id="util-settings" class="util"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="m9 3-.6 2.4-2 1.2L4 6l-2 3.5L3.8 11v2L2 14.5 4 18l2.4-.6 2 1.2L9 21h6l.6-2.4 2-1.2 2.4.6 2-3.5-1.8-1.5v-2L22 9.5 20 6l-2.4.6-2-1.2L15 3Z"/></svg><span>Settings</span></div>
  </div>
  <div id="picker">
    <div id="pick-name"></div>
    <div id="pick-strip"></div>
    <div id="pick-hint">Left and right to browse &middot; OK to keep &middot; Back to cancel</div>
  </div>
  <div id="dock"><div id="glass"></div><div id="tiles"></div></div>
  <div id="list"><div id="items"></div></div>
</div>
<div id="settings">
  <div class="panel">
    <h1>Settings</h1>
    <div id="rows"></div>
    <div class="hint">Back to close</div>
  </div>
</div>
<div id="toast"></div>
<script src="wallpapers.js"></script>
<script src="main.js"></script>
</body>
</html>
